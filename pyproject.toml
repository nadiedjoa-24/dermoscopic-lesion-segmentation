[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dermoseg"
version = "1.0.0"
description = "Classical computer-vision segmentation of dermoscopic skin lesions"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Theophile Nadiedjoa" },
    { name = "Agshay Nadanakumar" },
]
keywords = ["dermoscopy", "segmentation", "image-processing", "isic", "melanoma"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "opencv-python>=4.8",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/nadiedjoa-24/dermoscopic-lesion-segmentation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
